<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>德州撲克籌碼結算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>德州撲克籌碼結算器</h1>
            <p class="subtitle">輕鬆計算籌碼兌換與分帳</p>
        </header>

        <!-- 兑换比例设置 -->
        <section class="exchange-section card">
            <div class="card__body">
                <h2>籌碼兌換比例設置</h2>
                <div class="exchange-input">
                    <div class="input-group">
                        <label class="form-label">籌碼數量</label>
                        <input type="number" id="chipAmount" class="form-control" value="1000" min="1">
                    </div>
                    <div class="exchange-symbol">=</div>
                    <div class="input-group">
                        <label class="form-label">現金金額</label>
                        <input type="number" id="cashAmount" class="form-control" value="500" min="1">
                    </div>
                </div>
                <div class="exchange-display">
                    <span id="exchangeRate">1 籌碼 = 0.5 現金</span>
                </div>
            </div>
        </section>

        <!-- 玩家信息输入 -->
        <section class="players-section card">
            <div class="card__body">
                <div class="section-header">
                    <h2>玩家資訊</h2>
                    <button class="btn btn--primary" id="addPlayerBtn">添加玩家</button>
                </div>
                
                <div class="players-container" id="playersContainer">
                    <!-- 玩家行将通过JavaScript动态添加 -->
                </div>

                <div class="balance-status" id="balanceStatus">
                    <div class="balance-info">
                        <span class="balance-label">總體平衡狀態：</span>
                        <span class="balance-value" id="balanceValue">0.00</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 账目不平衡处理 -->
        <section class="balance-section card hidden" id="balanceSection">
            <div class="card__body">
                <h2>賬目調整</h2>
                <p class="balance-message">
                    賬目不平衡，差額：<span id="imbalanceAmount">0</span> 現金
                </p>
                <div class="balance-actions">
                    <div class="action-group">
                        <label class="form-label">選擇將差額分配給：</label>
                        <select class="form-control" id="adjustPlayer">
                            <option value="">請選擇玩家</option>
                        </select>
                        <button class="btn btn--primary" id="adjustBalanceBtn">調整賬目</button>
                    </div>
                    <div class="action-divider">或</div>
                    <button class="btn btn--secondary" id="reenterDataBtn">重新輸入數據</button>
                </div>
            </div>
        </section>

        <!-- 结算结果 -->
        <section class="results-section card hidden" id="resultsSection">
            <div class="card__body">
                <h2>結算結果</h2>
                
                <div class="results-tabs">
                    <button class="tab-btn active" data-tab="transfers">轉帳方案</button>
                    <button class="tab-btn" data-tab="summary">損益統計</button>
                </div>

                <div class="tab-content active" id="transfersTab">
                    <div class="transfers-list" id="transfersList">
                        <!-- 转账信息将通过JavaScript生成 -->
                    </div>
                </div>

                <div class="tab-content" id="summaryTab">
                    <div class="summary-list" id="summaryList">
                        <!-- 损益统计将通过JavaScript生成 -->
                    </div>
                </div>

                <div class="results-actions">
                    <button class="btn btn--primary btn--full-width" id="calculateBtn">重新計算</button>
                </div>
            </div>
        </section>

        <!-- 计算按钮 -->
        <div class="calculate-section">
            <button class="btn btn--lg btn--primary btn--full-width" id="finalCalculateBtn">計算分帳</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
